<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow-lg p-4">
            <h1 class="text-center text-primary mb-4">TodoList</h1>
            
            <div class="mb-4">
                <h5>Adicione sua tarefa</h5>
                <div class="input-group">
                    <input type="text" id="taskInput" class="form-control me-2" placeholder="Vai fazer o que?">
                    <select id="priorityInput" class="form-select me-2" style="max-width: 120px;">
                        <option value="Baixo">Baixo</option>
                        <option value="Médio">Médio</option>
                        <option value="Alto">Alto</option>
                    </select>
                    <button class="btn btn-primary" id="addTaskBtn">
                        <box-icon name='plus' color="white"></box-icon>
                    </button>
                </div>
            </div>
            
            <div class="mb-4">
                <div class="row">
                    <div class="col-md-6">
                        <h5>Pesquisar</h5>
                        <input type="text" id="filterInput" class="form-control" placeholder="Buscar...">
                    </div>
                    <div class="col-md-6">
                        <h5>Filtrar</h5>
                        <select id="filterPriority" class="form-select">
                            <option value="">Todos</option>
                            <option value="Baixo">Baixo</option>
                            <option value="Médio">Médio</option>
                            <option value="Alto">Alto</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div id="taskList" class="row g-3"></div>
            
        </div>
    </div>
</body>
</html>
