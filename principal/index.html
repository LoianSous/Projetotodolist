<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <header>
            <h1>Todo List</h1>
        </header>

        <form id="formulario">
            <p>adicione sua tarefa</p>
            <div class="formulario_ferramentas">
                <input type="text" id="form_input" placeholder="Vai fazer o que?">
                <select name="select" id="select">
                    <option value="alto">Alto</option>
                    <option value="medio">Médio</option>
                    <option value="baixo">Baixo</option>
                </select>

                <button type="submit">+</button>
            </div>
        </form>
        
        
        <div id="formulario_baixo">
            <div id="pesquisa">
                <h2>Pesquisar:</h2>
                <form>
                    <input type="text" id="pesquisa_input" placeholder="Buscar">
                    <button id="botao_apagar">COLOCAR ICONE DPS</button> 
                </form>
            </div>
        </div>

        <div id="filto">
            <h2>Filtrar</h2>
            
        </div>
    </div>
</body>
</html>
